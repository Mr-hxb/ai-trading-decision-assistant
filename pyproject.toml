[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-decision-assistant"
version = "0.1.0"
description = "Local MVP for rule-based AI-assisted trading decision review."
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
akshare = ["akshare"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
